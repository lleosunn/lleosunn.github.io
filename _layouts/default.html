<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    {% assign asset_version = site.time | date: '%s' %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include seo.html %}
    <link rel="icon" href="{{ '/assets/img/favicons/favicon.ico' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/lib/fontawesome-free/css/all.min.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ asset_version }}">
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <header class="site-bar">
      <nav class="site-nav" aria-label="Primary navigation">
        <div class="nav-links">
          <a class="nav-link" href="{{ '/' | relative_url }}">
            <span>Home</span>
          </a>
          <a class="nav-link" href="https://www.linkedin.com/in/{{ site.linkedin.username }}/" target="_blank" rel="noopener noreferrer">
            <span>LinkedIn</span>
          </a>
          <a class="nav-link" href="https://github.com/{{ site.github.username }}" target="_blank" rel="noopener noreferrer">
            <span>GitHub</span>
          </a>
          <a class="nav-link" href="{{ '/resume/' | relative_url }}">
            <span>Resume</span>
          </a>
          <button class="theme-toggle" type="button" aria-label="Switch color theme" aria-pressed="false">
            <i class="fa-solid fa-moon theme-toggle__icon theme-toggle__icon--dark" aria-hidden="true"></i>
            <i class="fa-solid fa-sun theme-toggle__icon theme-toggle__icon--light" aria-hidden="true"></i>
            <span class="sr-only">Switch color theme</span>
          </button>
        </div>
      </nav>
    </header>

    <main class="site-main">
      {{ content }}
    </main>

    <script src="{{ '/assets/js/theme.js' | relative_url }}?v={{ asset_version }}"></script>
  </body>
</html>
