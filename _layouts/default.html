<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>
      {% if page.title and page.title != "Home" %}
        {{ page.title }} | {{ site.title }}
      {% else %}
        {{ site.title }}
      {% endif %}
    </title>
    <link rel="icon" href="{{ '/assets/img/favicons/favicon.ico' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/lib/fontawesome-free/css/all.min.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <header class="site-bar" aria-label="Site controls">
      <a class="home-link" href="{{ '/' | relative_url }}" aria-label="Home">
        <i class="fa-solid fa-house" aria-hidden="true"></i>
        <span>Home</span>
      </a>
      <button class="theme-toggle" type="button" aria-label="Switch color theme" aria-pressed="false">
        <span class="theme-toggle__track" aria-hidden="true">
          <span class="theme-toggle__thumb">
            <i class="fa-solid fa-sun theme-toggle__sun"></i>
            <i class="fa-solid fa-moon theme-toggle__moon"></i>
          </span>
        </span>
      </button>
    </header>

    <main class="site-main">
      {{ content }}
    </main>

    <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  </body>
</html>
