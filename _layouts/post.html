---
layout: default
---

<article class="project-page">
  <header class="project-hero">
    <p class="eyebrow">
      {% if page.years %}
        {{ page.years }}
      {% else %}
        {{ page.date | date: "%Y" }}
      {% endif %}
    </p>
    <h1>{{ page.title }}</h1>
    <p class="project-lede">{{ page.description }}</p>
    {% if page.hero_video.path %}
      <figure class="project-hero__media">
        <video autoplay loop muted playsinline preload="metadata"{% if page.hero_video.poster %} poster="{{ page.hero_video.poster | relative_url }}"{% endif %}>
          <source src="{{ page.hero_video.path | relative_url }}" type="{{ page.hero_video.type | default: 'video/mp4' }}">
        </video>
        {% if page.hero_video.caption %}
          <figcaption>{{ page.hero_video.caption }}</figcaption>
        {% endif %}
      </figure>
    {% elsif page.image.path %}
      <figure class="project-hero__image">
        <img src="{{ page.image.path | relative_url }}" alt="{{ page.image.alt | default: page.title | escape }}">
      </figure>
    {% endif %}
  </header>

  <div class="project-content">
    {{ content }}
  </div>
</article>
