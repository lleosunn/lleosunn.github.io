---
layout: default
---

{% assign asset_version = site.time | date: '%s' %}

{%- comment -%}
  No <h1> here: the project title is the left pane's heading.
{%- endcomment -%}
<article class="project">
  {% if page.hero_video.path %}
    <figure class="project__media">
      <video autoplay loop muted playsinline preload="metadata"{% if page.hero_video.poster %} poster="{{ page.hero_video.poster | relative_url }}?v={{ asset_version }}"{% endif %}>
        <source src="{{ page.hero_video.path | relative_url }}?v={{ asset_version }}" type="{{ page.hero_video.type | default: 'video/mp4' }}">
      </video>
      {% if page.hero_video.caption %}
        <figcaption>{{ page.hero_video.caption }}</figcaption>
      {% endif %}
    </figure>
  {% elsif page.image.path %}
    <figure class="project__media">
      <img src="{{ page.image.path | relative_url }}?v={{ asset_version }}" alt="{{ page.image.alt | default: page.title | escape }}">
    </figure>
  {% endif %}

  <div class="prose">
    {{ content }}
  </div>
</article>
