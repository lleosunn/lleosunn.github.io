---
layout: default
---

<article class="project-page">
  <header class="project-hero">
    <a class="back-link" href="{{ '/' | relative_url }}">
      <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
      <span>Work</span>
    </a>
    <p class="eyebrow">
      {% if page.years %}
        {{ page.years }}
      {% else %}
        {{ page.date | date: "%Y" }}
      {% endif %}
    </p>
    <h1>{{ page.title }}</h1>
    <p class="project-lede">{{ page.description }}</p>
    {% if page.image.path %}
      <figure class="project-hero__image">
        <img src="{{ page.image.path | relative_url }}" alt="{{ page.image.alt | default: page.title | escape }}">
      </figure>
    {% endif %}
  </header>

  <div class="project-content">
    {{ content }}
  </div>
</article>
